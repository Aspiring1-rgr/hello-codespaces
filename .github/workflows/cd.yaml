name: Deploy Blog Application
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy-frontend.outputs.url }}
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: google-github-actions/auth@v1
        with:
          service_account: ${{ secrets.GOOGLECLOUD_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GOOGLECLOUD_CREDENTIALS }}
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/blog-backend:${{ github.sha }}
      - name: Verify backend image availability
        run: |
          IMAGE="aspiring1rgr/blog-backend:${GITHUB_SHA}"

          for i in {1..6}; do
            echo "Checking backend image (attempt $i/6)..."

            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "Backend image is available on Docker Hub!"
              exit 0
            fi

            echo "Backend image not available yet."
            if [ "$i" -lt 6 ]; then
              sleep $((i * 5))
            fi
          done

          echo "ERROR: Backend image was not available after 6 attempts."
          exit 1
      - id: deploy-backend
        name: Deploy backend
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: blog-backend
          image: ${{ secrets.DOCKERHUB_USERNAME }}/blog-backend:${{ github.sha }}
          region: ${{ secrets.GOOGLECLOUD_REGION }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/blog-frontend:${{ github.sha }}
          build-args: VITE_BACKEND_URL=${{ steps.deploy-backend.outputs.url }}/api/v1

      - name: Verify frontend image availability
        run: |
          IMAGE="aspiring1rgr/blog-frontend:${GITHUB_SHA}"

          for i in {1..6}; do
            echo "Checking frontend image (attempt $i/6)..."

            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "Frontend image is available on Docker Hub!"
              exit 0
            fi

            echo "Frontend image not available yet."
            if [ "$i" -lt 6 ]; then
              sleep $((i * 5))
            fi
          done

          echo "ERROR: Frontend image was not available after 6 attempts."
          exit 1
      - id: deploy-frontend
        name: Deploy frontend
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: blog-frontend
          image: ${{ secrets.DOCKERHUB_USERNAME }}/blog-frontend:${{ github.sha }}
          region: ${{ secrets.GOOGLECLOUD_REGION }}
